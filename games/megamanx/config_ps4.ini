; PS4 overrides merged over the game's config.ini defaults.
[General]
Autosave = 0
SkipLauncher = 1
[Graphics]
WindowSize = 1920x1080
Fullscreen = 1
OutputMethod = SDL
LinearFiltering = 0
Shader =
[Sound]
EnableAudio = 1
AudioFreq = 48000
AudioChannels = 2
AudioSamples = 1024
[GamepadMap]
EnableGamepad1 = true
EnableGamepad2 = true
; The host's current default (10%); the game's shipped file still says 10000,
; which the host would otherwise migrate and rewrite on first boot.
GamepadDeadzone = 3277
; PS4 SDL port reports OPTIONS as "Back" and the touchpad click as "Start":
; SNES Start = OPTIONS, SNES Select = touchpad. Face buttons keep the SNES
; positions (Cross = B/jump, Square = Y/shoot, Circle = A/dash).
Controls =   DpadUp, DpadDown, DpadLeft, DpadRight, Start, Back, B, A, Y, X, Lb, Rb
ControlsP2 = DpadUp, DpadDown, DpadLeft, DpadRight, Start, Back, B, A, Y, X, Lb, Rb
; Console hotkeys (no keyboard): R3 = save-state browser, L3 = rewind,
; hold R2 = fast-forward.
SaveStateMenu = R3
Rewind = L3
Turbo = R2
