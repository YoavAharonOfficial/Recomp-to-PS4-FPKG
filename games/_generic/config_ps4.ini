; Console overrides layered over every generic title's own config.ini.
[General]
Autosave = 0
SkipLauncher = 1
[Graphics]
WindowSize = 1920x1080
Fullscreen = 1
OutputMethod = SDL
LinearFiltering = 0
Shader =
VSync = 1
[Sound]
EnableAudio = 1
AudioFreq = 48000
AudioChannels = 2
AudioSamples = 1024
[GamepadMap]
EnableGamepad1 = true
EnableGamepad2 = true
GamepadDeadzone = 3277
; PS4 SDL reports OPTIONS as "Back" and the touchpad click as "Start":
; SNES Start = OPTIONS, SNES Select = touchpad click.
Controls =   DpadUp, DpadDown, DpadLeft, DpadRight, Start, Back, B, A, Y, X, Lb, Rb
ControlsP2 = DpadUp, DpadDown, DpadLeft, DpadRight, Start, Back, B, A, Y, X, Lb, Rb
; No keyboard: R3 = save-state browser, L3 = rewind, hold R2 = fast-forward.
SaveStateMenu = R3
Rewind = L3
Turbo = R2
