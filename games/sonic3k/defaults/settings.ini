; Sonic 3 & Knuckles on PS4: seeded once into /data/Sonic3K/; edit freely.
[video]
fullscreen = 0
linear_filter = 0
internal_scale = 1
presentation_rate = 0

[audio]
bypass_filter = 1

[mods.widescreen]
enabled = 1
aspect = 16:9

[mods.diagnostics]
enabled = 0

[input.p1]
device = 2
; PacBrew's PS4 SDL reports OPTIONS as Back (4) and the touchpad click as
; Start (6): Genesis Start = OPTIONS, Mode = touchpad.
pad.Start = button:4
pad.Mode = button:6
